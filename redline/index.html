<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NOVA RED LINE · Online Mastering</title>
<style>
html,body{margin:0;min-height:100%;background:#070707;color:#fff;font-family:Segoe UI,Arial,sans-serif}
#boot{min-height:100vh;display:grid;place-items:center;color:#aaa;font-size:13px;letter-spacing:.08em;text-align:center;padding:24px;line-height:1.7}
</style>
</head>
<body>
<div id="boot">NOVA RED LINE · LOADING</div>
<script>
(async()=>{
const boot=document.getElementById('boot');
let stage='INIT';
try{
  stage='LOAD PARTS';
  const ver='20260916f';
  const sources=await Promise.all(Array.from({length:14},async(_,i)=>{
    const name=`part${String(i).padStart(2,'0')}.js`;
    const url=`/redline/page-parts/${name}?v=${ver}-${Date.now()}`;
    const r=await fetch(url,{cache:'no-store',credentials:'same-origin'});
    if(!r.ok)throw new Error(`${name} HTTP ${r.status}`);
    return {name,text:await r.text()};
  }));

  stage='VERIFY PARTS';
  const chunks=sources.map(({name,text})=>{
    const m=text.match(/^export\s+default\s+['\"]([A-Za-z0-9+/=_-]+)['\"]\s*;?\s*$/s);
    if(!m)throw new Error(`${name} payload format error`);
    return m[1];
  });
  if(chunks.length!==14)throw new Error('payload part count mismatch');

  // Repair three historical payload fragments that were truncated during the original split.
  if(chunks[6].length===9999) chunks[6]=chunks[6].slice(0,3519)+'p'+chunks[6].slice(3519);
  if(chunks[7].length===9999) chunks[7]=chunks[7].slice(0,9837)+'/'+chunks[7].slice(9837);
  if(chunks[9].length===9985) chunks[9]='HyWnwGj/NynMJH1'+chunks[9];
  for(let i=0;i<13;i++) if(chunks[i].length!==10000) throw new Error(`part${String(i).padStart(2,'0')} length ${chunks[i].length}`);
  if(chunks[13].length!==8388) throw new Error(`part13 length ${chunks[13].length}`);

  stage='BASE64';
  let payload=chunks.join('').replace(/\s+/g,'').replace(/-/g,'+').replace(/_/g,'/').replace(/[^A-Za-z0-9+/=]/g,'');
  payload=payload.replace(/=/g,'');
  payload+='='.repeat((4-(payload.length%4))%4);
  const bin=atob(payload);
  const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));
  if(bytes.length<3||bytes[0]!==0x1f||bytes[1]!==0x8b)throw new Error('gzip header verification failed');

  stage='GZIP';
  if(!('DecompressionStream' in window))throw new Error('최신 Chrome 또는 Edge에서 열어 주세요.');
  const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  const reader=stream.getReader();
  const decoder=new TextDecoder('utf-8');
  let html='';
  while(true){
    const {value,done}=await reader.read();
    if(done)break;
    html+=decoder.decode(value,{stream:true});
  }
  html+=decoder.decode();

  stage='VERIFY HTML';
  if(!html||!html.includes('<html')||!html.includes('NOVA RED LINE'))throw new Error('RED LINE 화면 데이터 검증 실패');

  // RED LINE ONLINE compatibility patch:
  // 1) STEM is intentionally reduced to VOCAL + MR only.
  // 2) FREE users can click every download control and get the same subscription popup.
  const onlineUiPatch=`<script>
  (function(){
    const hideNames=new Set(['DRUMS','BASS','GUITAR','PIANO']);

    function isSubscribed(){
      return window.NOVA_REDLINE_SUBSCRIBED===true;
    }

    function singleAudioCard(el){
      let n=el;
      for(let i=0;i<7&&n;i++,n=n.parentElement){
        if(n.querySelectorAll&&n.querySelectorAll('audio').length===1)return n;
      }
      return null;
    }

    function ensurePopup(){
      if(document.getElementById('novaSubscriptionPopup'))return;
      const wrap=document.createElement('div');
      wrap.id='novaSubscriptionPopup';
      wrap.innerHTML='<div class="novaSubDialog"><b>DOWNLOAD LOCKED</b><strong>정기구독 후 다운로드 가능합니다.</strong><span>무료 모드에서는 Preview만 제공됩니다.</span><div><button type="button" data-nova-sub-close>확인</button><a href="/redline/subscription/">정기구독 보기</a></div></div>';
      document.body.appendChild(wrap);
      wrap.addEventListener('click',e=>{if(e.target===wrap||e.target.closest('[data-nova-sub-close]'))wrap.classList.remove('show')});
    }

    function showSubscriptionPopup(){
      ensurePopup();
      document.getElementById('novaSubscriptionPopup')?.classList.add('show');
    }

    function isDownloadControl(el){
      if(!el)return false;
      const text=(el.textContent||'').trim();
      const id=String(el.id||'').toLowerCase();
      const cls=String(el.className||'').toLowerCase();
      if(el.matches?.('a[download]'))return true;
      if(id.includes('download')||cls.split(/\s+/).includes('download'))return true;
      return /DOWNLOAD|다운로드/i.test(text)&&!/정기구독\s*(보기|시작)/.test(text);
    }

    function forceDownloadFromCard(trigger){
      const card=singleAudioCard(trigger);
      const audio=card?.querySelector('audio');
      const src=audio?.currentSrc||audio?.src||'';
      if(!src)return false;
      const label=(card.textContent||'').toUpperCase();
      const filename=label.includes('VOCAL')&&!label.includes('MR')?'VOCAL.wav':'MR.wav';
      const a=document.createElement('a');
      a.href=src;
      a.download=filename;
      a.rel='noopener';
      document.body.appendChild(a);
      a.click();
      a.remove();
      return true;
    }

    function patchStemUi(){
      try{
        const styleId='nova-online-ui-patch';
        if(!document.getElementById(styleId)){
          const s=document.createElement('style');
          s.id=styleId;
          s.textContent=`
            .novaTwoStemHidden{display:none!important}
            #novaSubscriptionPopup{position:fixed;inset:0;z-index:999999;display:none;align-items:center;justify-content:center;background:#000b;padding:20px}
            #novaSubscriptionPopup.show{display:flex}
            .novaSubDialog{width:min(420px,92vw);border:1px solid #6b2834;border-radius:9px;background:linear-gradient(180deg,#17191d,#090a0c);box-shadow:0 22px 70px #000;padding:24px;text-align:center;color:#fff}
            .novaSubDialog>b{display:block;color:#ff4c64;font-size:12px;letter-spacing:.13em;margin-bottom:12px}
            .novaSubDialog>strong{display:block;font-size:20px;margin-bottom:9px}
            .novaSubDialog>span{display:block;color:#aeb2b9;font-size:13px;margin-bottom:20px}
            .novaSubDialog>div{display:grid;grid-template-columns:1fr 1fr;gap:10px}
            .novaSubDialog button,.novaSubDialog a{display:flex;align-items:center;justify-content:center;min-height:42px;border-radius:5px;border:1px solid #444;text-decoration:none;color:#fff;background:#17191d;font-weight:700;cursor:pointer}
            .novaSubDialog a{border-color:#bd243a;background:linear-gradient(#ef334f,#9e1429)}
          `;
          document.head.appendChild(s);
        }
        ensurePopup();

        document.querySelectorAll('select').forEach(sel=>{
          const text=Array.from(sel.options||[]).map(o=>o.textContent||'').join(' ');
          if(/4\s*STEM|6\s*STEM/i.test(text)){
            sel.dataset.novaTwoStem='1';
            sel.innerHTML='<option value="vocal-mr">VOCAL / MR · CLEAN SEPARATION</option>';
            sel.value='vocal-mr';
            sel.disabled=true;
          }
        });

        document.querySelectorAll('h1,h2,h3,h4,strong,span,label,div,small,button,option').forEach(el=>{
          const t=(el.textContent||'').trim();
          if(!t)return;
          if(el.children.length===0&&(/4\s*STEM|6\s*STEM/i.test(t))){
            el.textContent='보컬과 MR을 고음질로 분리합니다.';
          }
          if((/STEM\s*[-·]\s*음원\s*분리/i.test(t)||t==='STEM · 음원 분리')&&el.children.length===0)el.textContent='VOCAL / MR 분리';
          if(/AI\s*STEM\s*분리\s*시작/i.test(t)&&el.children.length===0)el.textContent='AI VOCAL / MR 분리 시작';
          if(t==='VOCALS'&&el.children.length===0)el.textContent='VOCAL';
          if(t==='OTHER'&&el.children.length===0)el.textContent='MR / INSTRUMENTAL';
          if(t==='other.wav'&&el.children.length===0)el.textContent='mr.wav';
          if(hideNames.has(t)){
            const card=singleAudioCard(el);
            if(card)card.classList.add('novaTwoStemHidden');
          }
        });

        document.querySelectorAll('button').forEach(btn=>{
          const t=(btn.textContent||'').trim();
          if(/DOWNLOAD\s*LOCKED/i.test(t)){
            btn.dataset.novaPaywallDownload='1';
            btn.disabled=false;
            btn.textContent='WAV 다운로드';
          }
        });

        document.querySelectorAll('a[download]').forEach(a=>{
          const d=(a.getAttribute('download')||'').toLowerCase();
          if(d.includes('other'))a.setAttribute('download','MR.wav');
          if(d.includes('vocals'))a.setAttribute('download','VOCAL.wav');
        });
      }catch(e){console.warn('NOVA ONLINE UI PATCH',e)}
    }

    document.addEventListener('click',function(e){
      const trigger=e.target.closest?.('button,a');
      if(!trigger||!isDownloadControl(trigger))return;

      if(!isSubscribed()){
        e.preventDefault();
        e.stopPropagation();
        e.stopImmediatePropagation();
        showSubscriptionPopup();
        return;
      }

      if(trigger.dataset.novaPaywallDownload==='1'){
        if(forceDownloadFromCard(trigger)){
          e.preventDefault();
          e.stopPropagation();
          e.stopImmediatePropagation();
        }
      }
    },true);

    if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',patchStemUi,{once:true});
    else patchStemUi();
    setTimeout(patchStemUi,250);
    setTimeout(patchStemUi,1000);
    const startObserver=()=>{
      if(!document.body)return;
      const mo=new MutationObserver(()=>patchStemUi());
      mo.observe(document.body,{subtree:true,childList:true,characterData:true});
    };
    if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',startObserver,{once:true});
    else startObserver();
  })();
  <\/script>`;
  html=html.replace(/<\/body>/i,onlineUiPatch+'</body>');

  stage='OPEN';
  document.open();
  document.write(html);
  document.close();
}catch(err){
  boot.textContent=`RED LINE 로딩 오류 · ${stage} · ${err?.message||String(err)}`;
  console.error('RED LINE LOADER',stage,err);
}
})();
</script>
</body>
</html>
