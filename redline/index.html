<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NOVA RED LINE · Online Mastering</title>
<style>
html,body{margin:0;min-height:100%;background:#070707;color:#fff;font-family:Segoe UI,Arial,sans-serif}
#boot{min-height:100vh;display:grid;place-items:center;color:#aaa;font-size:13px;letter-spacing:.08em;text-align:center;padding:24px;line-height:1.7}
</style>
</head>
<body>
<div id="boot">NOVA RED LINE · LOADING</div>
<script>
(async()=>{
const boot=document.getElementById('boot');
let stage='INIT';
try{
  stage='LOAD PARTS';
  const ver='20260916k';
  const sources=await Promise.all(Array.from({length:14},async(_,i)=>{
    const name=`part${String(i).padStart(2,'0')}.js`;
    const url=`/redline/page-parts/${name}?v=${ver}-${Date.now()}`;
    const r=await fetch(url,{cache:'no-store',credentials:'same-origin'});
    if(!r.ok)throw new Error(`${name} HTTP ${r.status}`);
    return {name,text:await r.text()};
  }));

  stage='VERIFY PARTS';
  const chunks=sources.map(({name,text})=>{
    const m=text.match(/^export\s+default\s+['\"]([A-Za-z0-9+/=_-]+)['\"]\s*;?\s*$/s);
    if(!m)throw new Error(`${name} payload format error`);
    return m[1];
  });
  if(chunks.length!==14)throw new Error('payload part count mismatch');

  if(chunks[6].length===9999) chunks[6]=chunks[6].slice(0,3519)+'p'+chunks[6].slice(3519);
  if(chunks[7].length===9999) chunks[7]=chunks[7].slice(0,9837)+'/'+chunks[7].slice(9837);
  if(chunks[9].length===9985) chunks[9]='HyWnwGj/NynMJH1'+chunks[9];
  for(let i=0;i<13;i++) if(chunks[i].length!==10000) throw new Error(`part${String(i).padStart(2,'0')} length ${chunks[i].length}`);
  if(chunks[13].length!==8388) throw new Error(`part13 length ${chunks[13].length}`);

  stage='BASE64';
  let payload=chunks.join('').replace(/\s+/g,'').replace(/-/g,'+').replace(/_/g,'/').replace(/[^A-Za-z0-9+/=]/g,'');
  payload=payload.replace(/=/g,'');
  payload+='='.repeat((4-(payload.length%4))%4);
  const bin=atob(payload);
  const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));
  if(bytes.length<3||bytes[0]!==0x1f||bytes[1]!==0x8b)throw new Error('gzip header verification failed');

  stage='GZIP';
  if(!('DecompressionStream' in window))throw new Error('최신 Chrome 또는 Edge에서 열어 주세요.');
  const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  const reader=stream.getReader();
  const decoder=new TextDecoder('utf-8');
  let html='';
  while(true){
    const {value,done}=await reader.read();
    if(done)break;
    html+=decoder.decode(value,{stream:true});
  }
  html+=decoder.decode();

  stage='VERIFY HTML';
  if(!html||!html.includes('<html')||!html.includes('NOVA RED LINE'))throw new Error('RED LINE 화면 데이터 검증 실패');

  const onlineUiPatch=`<script>
  (function(){
    function isSubscribed(){
      if(window.NOVA_REDLINE_SUBSCRIBED===true)return true;
      var badge=document.getElementById('onlinePlanBadge');
      var state=document.getElementById('onlineAccessState');
      var text=(((badge&&badge.textContent)||'')+' '+((state&&state.textContent)||'')).toUpperCase();
      if(text.indexOf('FREE')>=0)return false;
      return /SUBSCRIBED|PAID|PREMIUM|ACTIVE/.test(text);
    }

    function ensureStyle(){
      if(document.getElementById('nova-online-ui-patch'))return;
      var s=document.createElement('style');
      s.id='nova-online-ui-patch';
      s.textContent='.novaTwoStemHidden{display:none!important}.novaGeneratedDownload{display:flex!important;align-items:center;justify-content:center;width:100%;margin-top:8px;min-height:38px;border:1px solid #583039!important;background:linear-gradient(180deg,#202226,#111317)!important;color:#fff!important;font-weight:800!important;cursor:pointer}#novaSubscriptionPopup{position:fixed;inset:0;z-index:999999;display:none;align-items:center;justify-content:center;background:#000b;padding:20px}#novaSubscriptionPopup.show{display:flex}.novaSubDialog{width:min(420px,92vw);border:1px solid #6b2834;border-radius:9px;background:linear-gradient(180deg,#17191d,#090a0c);box-shadow:0 22px 70px #000;padding:24px;text-align:center;color:#fff}.novaSubDialog>b{display:block;color:#ff4c64;font-size:12px;letter-spacing:.13em;margin-bottom:12px}.novaSubDialog>strong{display:block;font-size:20px;margin-bottom:9px}.novaSubDialog>span{display:block;color:#aeb2b9;font-size:13px;margin-bottom:20px}.novaSubDialog>div{display:grid;grid-template-columns:1fr 1fr;gap:10px}.novaSubDialog button,.novaSubDialog a{display:flex;align-items:center;justify-content:center;min-height:42px;border-radius:5px;border:1px solid #444;text-decoration:none;color:#fff;background:#17191d;font-weight:700;cursor:pointer}.novaSubDialog a{border-color:#bd243a;background:linear-gradient(#ef334f,#9e1429)}';
      document.head.appendChild(s);
    }

    function ensurePopup(){
      if(document.getElementById('novaSubscriptionPopup'))return;
      var wrap=document.createElement('div');
      wrap.id='novaSubscriptionPopup';
      wrap.innerHTML='<div class="novaSubDialog"><b>DOWNLOAD LOCKED</b><strong>정기구독 후 다운로드 가능합니다.</strong><span>무료 모드에서는 결과를 미리듣기로 확인할 수 있습니다.</span><div><button type="button" data-nova-sub-close>확인</button><a href="/redline/subscription/">정기구독 보기</a></div></div>';
      document.body.appendChild(wrap);
      wrap.addEventListener('click',function(e){if(e.target===wrap||e.target.closest('[data-nova-sub-close]'))wrap.classList.remove('show')});
    }

    function showSubscriptionPopup(){ensurePopup();var p=document.getElementById('novaSubscriptionPopup');if(p)p.classList.add('show')}

    function singleAudioCard(el){
      var n=el;
      for(var i=0;i<7&&n;i++,n=n.parentElement){if(n.querySelectorAll&&n.querySelectorAll('audio').length===1)return n}
      return null;
    }

    function isDownloadControl(el){
      if(!el)return false;
      var text=(el.textContent||'').trim();
      var id=String(el.id||'').toLowerCase();
      var cls=String(el.className||'').toLowerCase();
      if(el.matches&&el.matches('a[download]'))return true;
      if(id.indexOf('download')>=0||cls.indexOf('download')>=0)return true;
      return /DOWNLOAD|다운로드/i.test(text)&&!/정기구독\s*(보기|시작)/.test(text);
    }

    function makeDownloadClickable(ctrl){
      if(!ctrl)return;
      ctrl.hidden=false;
      if('disabled' in ctrl)ctrl.disabled=false;
      ctrl.removeAttribute('disabled');
      ctrl.removeAttribute('aria-disabled');
      ctrl.dataset.novaPaywallDownload='1';
      if(/DOWNLOAD\s*LOCKED/i.test((ctrl.textContent||'').trim()))ctrl.textContent='WAV 다운로드';
      if(getComputedStyle(ctrl).display==='none')ctrl.style.setProperty('display',ctrl.tagName==='A'?'block':'flex','important');
    }

    function patchStemLayout(){
      var ws=document.getElementById('stemWorkspace');
      if(!ws)return;

      var hero=ws.querySelector('.stemHero');
      if(hero){
        var h=hero.querySelector('h2');
        var p=hero.querySelector('p');
        if(h)h.textContent='VOCAL / MR 분리';
        if(p)p.textContent='한 곡을 업로드하면 보컬(VOCAL)과 반주(MR / INSTRUMENTAL) 두 트랙으로 깔끔하게 분리합니다.';
      }

      var mode=document.getElementById('stemMode');
      if(mode){
        mode.innerHTML='<option value="2">VOCAL / MR · CLEAN SEPARATION</option>';
        mode.value='2';
        var modeBox=mode.closest('.filebox');
        if(modeBox)modeBox.style.setProperty('display','none','important');
      }
      var src=document.getElementById('stemFile');
      var srcBox=src&&src.closest('.filebox');
      if(srcBox)srcBox.style.gridColumn='1 / -1';

      var heading=Array.from(ws.querySelectorAll('h2')).find(function(x){return /STEM PREVIEW/i.test(x.textContent||'')});
      if(heading)heading.textContent='2. VOCAL / MR PREVIEW';

      ['drums','bass','guitar','piano'].forEach(function(name){
        var c=ws.querySelector('.stemCard[data-stem="'+name+'"]');
        if(c)c.classList.add('novaTwoStemHidden');
      });

      var vocal=ws.querySelector('.stemCard[data-stem="vocals"]');
      if(vocal){
        var vh=vocal.querySelector('.stemCardHead strong');
        var vf=vocal.querySelector('.stemCardHead span');
        if(vh)vh.textContent='VOCAL';
        if(vf)vf.textContent='VOCAL.wav';
      }
      var mr=ws.querySelector('.stemCard[data-stem="other"]');
      if(mr){
        var mh=mr.querySelector('.stemCardHead strong');
        var mf=mr.querySelector('.stemCardHead span');
        if(mh)mh.textContent='MR / INSTRUMENTAL';
        if(mf)mf.textContent='MR.wav';
      }

      var run=document.getElementById('stemRunBtn');
      if(run)run.textContent='AI VOCAL / MR 분리 시작';

      ws.querySelectorAll('.stemCard button').forEach(makeDownloadClickable);

      var trial=ws.querySelector('.onlineTrialNotice');
      if(trial)trial.innerHTML='<b>FREE PREVIEW</b> · VOCAL과 MR은 각각 최대 60초까지 청취할 수 있습니다. 정기구독 후 WAV 다운로드가 열립니다.';

      var access=document.querySelector('.onlineAccessBar');
      if(access&&!ws.hidden){
        var b=access.querySelector('b'),span=access.querySelector('span'),state=document.getElementById('onlineAccessState');
        if(b)b.textContent='ONLINE STEM';
        if(span)span.textContent='AI VOCAL / MR SEPARATION · WAV 24-bit output';
        if(state)state.innerHTML='<strong>FREE</strong> · VOCAL / MR 분리 가능 · Preview 60초 · Download Locked';
      }
    }

    function patchDownloads(){
      document.querySelectorAll('button,a').forEach(function(ctrl){
        if(!isDownloadControl(ctrl))return;
        if(ctrl.closest&&ctrl.closest('.onlineBigAction'))return;
        makeDownloadClickable(ctrl);
      });
    }

    function forceDownloadFromCard(trigger){
      var card=singleAudioCard(trigger);
      var audio=card&&card.querySelector('audio');
      var src=(audio&&(audio.currentSrc||audio.src))||'';
      if(!src)return false;
      var label=(card.textContent||'').toUpperCase();
      var filename='NOVA_REDLINE_OUTPUT.wav';
      if(label.indexOf('VOCAL')>=0&&label.indexOf('MR')<0)filename='VOCAL.wav';
      else if(label.indexOf('MR')>=0||label.indexOf('INSTRUMENTAL')>=0)filename='MR.wav';
      var a=document.createElement('a');a.href=src;a.download=filename;a.rel='noopener';document.body.appendChild(a);a.click();a.remove();return true;
    }

    function installStemUploadV2(){
      if(window.__NOVA_STEM_UPLOAD_V2__)return;
      var oldRun=document.getElementById('stemRunBtn');
      var oldCancel=document.getElementById('stemCancelBtn');
      var fileInput=document.getElementById('stemFile');
      var statusEl=document.getElementById('stemStatus');
      var progressEl=document.getElementById('stemProgress');
      if(!oldRun||!oldCancel||!fileInput||!statusEl||!progressEl)return;
      window.__NOVA_STEM_UPLOAD_V2__=true;

      var run=oldRun.cloneNode(true);
      var cancel=oldCancel.cloneNode(true);
      oldRun.replaceWith(run);
      oldCancel.replaceWith(cancel);
      run.id='stemRunBtn';cancel.id='stemCancelBtn';
      run.textContent='AI VOCAL / MR 분리 시작';
      cancel.disabled=true;

      var jobId=null,inputUrl=null,inputPath=null,currentXhr=null,canceled=false;
      function setStatus(text,p){statusEl.textContent=text;progressEl.style.width=Math.max(0,Math.min(100,p||0))+'%'}
      function safeName(name){return String(name||'audio.wav').replace(/[^a-zA-Z0-9._-]/g,'-').slice(-100)}
      function mb(n){return (n/1024/1024).toFixed(1)}

      async function api(url,options,timeoutMs){
        var ctl=new AbortController();
        var timer=setTimeout(function(){ctl.abort()},timeoutMs||20000);
        try{
          var opts=Object.assign({},options||{},{signal:ctl.signal});
          var r=await fetch(url,opts);
          var d=await r.json().catch(function(){return {}});
          if(!r.ok)throw new Error(d.error||('Request failed ('+r.status+')'));
          return d;
        }finally{clearTimeout(timer)}
      }

      async function cleanup(){
        if(!inputUrl&&!inputPath)return;
        var u=inputUrl,p=inputPath;inputUrl=null;inputPath=null;
        try{await api('/api/redline/stem-cleanup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:u,pathname:p})},12000)}catch(e){}
      }

      function resetCards(){
        ['vocals','other'].forEach(function(name){
          var c=document.querySelector('.stemCard[data-stem="'+name+'"]');
          if(!c)return;
          var a=c.querySelector('audio');
          if(a){a.pause();a.removeAttribute('src');a.load()}
          c.classList.remove('ready','unavailable');
          var b=c.querySelector('button');if(b)makeDownloadClickable(b);
        });
      }

      function applyOutput(out){
        out=out&&typeof out==='object'?out:{};
        var vocalUrl=out.vocals||out.vocal||out.voice||null;
        var mrUrl=out.mr||out.no_vocals||out.instrumental||out.accompaniment||out.other||null;
        [['vocals',vocalUrl],['other',mrUrl]].forEach(function(pair){
          var c=document.querySelector('.stemCard[data-stem="'+pair[0]+'"]');
          if(!c)return;
          var a=c.querySelector('audio');
          if(pair[1]){a.src=pair[1];c.classList.add('ready');c.classList.remove('unavailable')}
          else{c.classList.add('unavailable');c.classList.remove('ready')}
          var b=c.querySelector('button');if(b)makeDownloadClickable(b);
        });
        setStatus('COMPLETE · VOCAL / MR 분리가 완료되었습니다. FREE는 60초 Preview입니다.',100);
      }

      function uploadDirect(file,presign){
        return new Promise(function(resolve,reject){
          var xhr=new XMLHttpRequest();currentXhr=xhr;
          var lastProgress=Date.now();
          var stall=setInterval(function(){
            if(Date.now()-lastProgress>45000){clearInterval(stall);try{xhr.abort()}catch(e){};reject(new Error('업로드가 45초 이상 진행되지 않았습니다. 네트워크를 확인한 뒤 다시 시도해 주세요.'))}
          },5000);
          xhr.open('PUT',presign.uploadUrl,true);
          xhr.timeout=240000;
          xhr.upload.onprogress=function(e){
            if(!e.lengthComputable)return;
            lastProgress=Date.now();
            var pct=Math.max(0,Math.min(100,e.loaded/e.total*100));
            setStatus('UPLOAD · '+Math.round(pct)+'% · '+mb(e.loaded)+' / '+mb(e.total)+' MB',5+pct*0.25);
          };
          xhr.onload=function(){clearInterval(stall);currentXhr=null;if(xhr.status>=200&&xhr.status<300)resolve();else reject(new Error('Blob upload failed ('+xhr.status+')'))};
          xhr.onerror=function(){clearInterval(stall);currentXhr=null;reject(new Error('업로드 네트워크 오류가 발생했습니다.'))};
          xhr.ontimeout=function(){clearInterval(stall);currentXhr=null;reject(new Error('업로드 시간이 초과되었습니다.'))};
          xhr.onabort=function(){clearInterval(stall);currentXhr=null;if(!canceled)reject(new Error('업로드가 중단되었습니다.'))};
          xhr.send(file);
        });
      }

      async function poll(){
        var attempt=0;
        while(!canceled&&jobId&&attempt<180){
          attempt++;
          await new Promise(function(r){setTimeout(r,2000)});
          var d=await api('/api/redline/stem?id='+encodeURIComponent(jobId),{},15000);
          if(d.status==='succeeded'){applyOutput(d.output);jobId=null;run.disabled=false;cancel.disabled=true;await cleanup();return}
          if(d.status==='failed'||d.status==='canceled')throw new Error(d.error||('STEM '+d.status));
          var p=Math.min(95,34+attempt*0.8);
          setStatus('AI VOCAL / MR 처리 중 · '+String(d.status||'processing').toUpperCase()+' · '+Math.round(p)+'%',p);
        }
        if(!canceled)throw new Error('STEM 처리 시간이 초과되었습니다.');
      }

      run.addEventListener('click',async function(){
        var file=fileInput.files&&fileInput.files[0];
        if(!file)return alert('음원 파일을 먼저 선택하세요.');
        if(file.size>80*1024*1024)return alert('STEM 파일은 최대 80MB까지 업로드할 수 있습니다.');
        canceled=false;run.disabled=true;cancel.disabled=false;resetCards();
        try{
          setStatus('UPLOAD 준비 중 · 서울 ICN1 저장소 연결…',3);
          var pathname='redline/stem-input/'+crypto.randomUUID()+'-'+safeName(file.name);
          var presign=await api('/api/redline/stem-upload',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'presign',pathname:pathname,size:file.size,contentType:file.type||'application/octet-stream'})},15000);
          inputUrl=presign.blobUrl;inputPath=presign.pathname||pathname;
          setStatus('UPLOAD 시작 · 0% · 0.0 / '+mb(file.size)+' MB',5);
          await uploadDirect(file,presign);
          if(canceled)return;
          setStatus('UPLOAD COMPLETE · AI 분리 작업 생성 중…',32);
          var job=await api('/api/redline/stem',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({audioPath:inputPath,audioUrl:inputUrl,mode:'2'})},20000);
          jobId=job.id;
          await poll();
        }catch(e){
          if(!canceled)setStatus('ERROR · '+(e&&e.message?e.message:String(e)),0);
          run.disabled=false;cancel.disabled=true;jobId=null;await cleanup();
        }
      });

      cancel.addEventListener('click',async function(){
        canceled=true;cancel.disabled=true;
        if(currentXhr){try{currentXhr.abort()}catch(e){}currentXhr=null}
        if(jobId){try{await api('/api/redline/stem?id='+encodeURIComponent(jobId),{method:'DELETE'},12000)}catch(e){}}
        jobId=null;run.disabled=false;setStatus('CANCELED',0);await cleanup();
      });
    }

    ensureStyle();ensurePopup();patchStemLayout();patchDownloads();installStemUploadV2();
    setTimeout(function(){patchStemLayout();patchDownloads();installStemUploadV2()},250);
    setTimeout(function(){patchStemLayout();patchDownloads();installStemUploadV2()},1000);

    document.addEventListener('click',function(e){
      var trigger=e.target.closest&&e.target.closest('button,a');
      if(!trigger||!isDownloadControl(trigger))return;
      if(trigger.closest&&trigger.closest('.onlineBigAction'))return;
      if(!isSubscribed()){
        e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();showSubscriptionPopup();return;
      }
      if(trigger.dataset.novaPaywallDownload==='1'&&!trigger.matches('a[href]')){
        if(forceDownloadFromCard(trigger)){e.preventDefault();e.stopPropagation();e.stopImmediatePropagation()}
      }
    },true);

    var mo=new MutationObserver(function(mutations){
      var need=false;
      for(var i=0;i<mutations.length;i++){
        var m=mutations[i];
        if(m.type==='attributes'&&m.attributeName==='disabled'&&m.target&&isDownloadControl(m.target)){need=true;break}
      }
      if(need)setTimeout(function(){patchDownloads()},0);
    });
    if(document.body)mo.observe(document.body,{subtree:true,attributes:true,attributeFilter:['disabled']});
  })();
  <\/script>`;
  const voiceCleanV2='<script src="/redline/voice-clean-v2.js?v='+ver+'-'+Date.now()+'"><\/script>';
  html=html.replace(/<\/body>/i,onlineUiPatch+voiceCleanV2+'</body>');

  stage='OPEN';
  document.open();
  document.write(html);
  document.close();
}catch(err){
  boot.textContent=`RED LINE 로딩 오류 · ${stage} · ${err?.message||String(err)}`;
  console.error('RED LINE LOADER',stage,err);
}
})();
</script>
</body>
</html>
