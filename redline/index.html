<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NOVA RED LINE · Online Mastering</title>
<style>
html,body{margin:0;min-height:100%;background:#070707;color:#fff;font-family:Segoe UI,Arial,sans-serif}
#boot{min-height:100vh;display:grid;place-items:center;color:#aaa;font-size:13px;letter-spacing:.08em}
</style>
</head>
<body>
<div id="boot">NOVA RED LINE · LOADING</div>
<script>
fetch('/api/redline/page',{cache:'no-store'})
  .then(r=>{if(!r.ok) throw new Error('HTTP '+r.status); return r.text()})
  .then(html=>{document.open();document.write(html);document.close()})
  .catch(err=>{document.getElementById('boot').textContent='RED LINE 로딩 오류 · '+err.message;console.error(err)})
</script>
</body>
</html>
