name: Build RED LINE User Guide

on:
  push:
    branches:
      - main
    paths:
      - scripts/build-redline-guide.py
      - .github/workflows/build-redline-guide.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: redline-user-guide
  cancel-in-progress: true

jobs:
  build-guide:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Korean fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-nanum

      - name: Install guide dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow reportlab playwright
          python -m playwright install --with-deps chromium

      - name: Build current-interface guide PDF
        env:
          REDLINE_GUIDE_URL: https://www.nsenter.co.kr/redline/
        run: python scripts/build-redline-guide.py

      - name: Commit generated guide
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add redline/NOVA_RED_LINE_ONLINE_MASTERING_GUIDE.pdf
          if git diff --cached --quiet; then
            echo "Guide is already current."
            exit 0
          fi
          git commit -m "Update RED LINE online user guide"
          git push
