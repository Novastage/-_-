name: Build NOVA RED LINE Android APK

on:
  push:
    branches: [ "android-v1-simple-core" ]
    paths:
      - "android/**"
      - ".github/workflows/android-debug-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses
        run: yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true

      - name: Install Android 37 SDK
        run: /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-37" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Gradle version
        run: gradle --version

      - name: Build debug APK
        env:
          NOVA_STEM_API_BASE_URL: https://www.nsenter.co.kr
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/NOVA_RED_LINE_MOBILE_V1_0_SIMPLE_CORE_DEBUG.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-RED-LINE-Mobile-Debug-APK
          path: android/app/build/outputs/apk/debug/NOVA_RED_LINE_MOBILE_V1_0_SIMPLE_CORE_DEBUG.apk
          if-no-files-found: error
          retention-days: 14
